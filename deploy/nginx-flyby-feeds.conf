# Same-origin proxies for the flyby transit layer (src/data/transitfeeds.ts).
#
# The MTA, BART and NYC Ferry GTFS-realtime feeds send no CORS headers, so the
# browser asks chadsmith.dev/flyby-feeds/... and this forwards. Responses are
# cached for 10 s: every viewer of a city polls the same few URLs every 30 s,
# so upstream sees at most one request per feed per 10 s however many people
# are flying, and the MTA's own feeds only refresh about every 30 s anyway.
#
# Install:
#   1. the two http-level lines (proxy_cache_path, limit_req_zone) go in the
#      http { } block, e.g. /etc/nginx/conf.d/flyby-feeds-http.conf;
#   2. the location blocks go inside the chadsmith.dev server { } block,
#      e.g. `include /etc/nginx/snippets/flyby-feeds.conf;`;
#   3. mkdir -p /var/cache/nginx/flyby-feeds && nginx -t && systemctl reload nginx.
#
# ---- http { } level ---------------------------------------------------------
# proxy_cache_path /var/cache/nginx/flyby-feeds levels=1 keys_zone=flyby_feeds:2m max_size=64m inactive=10m use_temp_path=off;
# A viewer polls 7 MTA feeds per 30 s cycle (plus 2 ferry feeds); 2 r/s with a
# burst of 20 lets one full cycle through at once and refuses a scraper.
# limit_req_zone $binary_remote_addr zone=flyby_feeds_ip:10m rate=2r/s;

# ---- server { } level -------------------------------------------------------
# Anything under /flyby-feeds/ that is not one of the feeds below. A plain
# prefix, not ^~, so the regex locations that follow still win.
location /flyby-feeds/ {
    return 404;
}

# MTA subway, one location per feed: nyct%2Fgtfs, -ace, -bdfm, -g, -jz, -nqrw, -l, -si.
location ~ ^/flyby-feeds/mta/(gtfs|gtfs-ace|gtfs-bdfm|gtfs-g|gtfs-jz|gtfs-nqrw|gtfs-l|gtfs-si)$ {
    limit_req zone=flyby_feeds_ip burst=20 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_cache flyby_feeds;
    proxy_cache_key "mta-$1";
    proxy_cache_valid 200 10s;
    proxy_cache_valid any 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_ssl_server_name on;
    proxy_set_header Host api-endpoint.mta.info;
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    # A variable in proxy_pass needs a resolver; the URI is built from the
    # captured feed name and the %2F the MTA's path requires.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_pass https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2F$1;
    add_header Cache-Control "public, max-age=10" always;
    add_header X-Cache-Status $upstream_cache_status always;
    expires 10s;
}

location = /flyby-feeds/bart/tripupdate {
    limit_req zone=flyby_feeds_ip burst=20 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_cache flyby_feeds;
    proxy_cache_key "bart-tripupdate";
    proxy_cache_valid 200 10s;
    proxy_cache_valid any 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_ssl_server_name on;
    proxy_set_header Host api.bart.gov;
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    proxy_pass https://api.bart.gov/gtfsrt/tripupdate.aspx;
    # BART labels the protobuf text/html.
    proxy_hide_header Content-Type;
    add_header Content-Type application/x-protobuf always;
    add_header Cache-Control "public, max-age=10" always;
    add_header X-Cache-Status $upstream_cache_status always;
    expires 10s;
}

location ~ ^/flyby-feeds/nycferry/(vehicleposition|tripupdate)$ {
    limit_req zone=flyby_feeds_ip burst=20 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_cache flyby_feeds;
    proxy_cache_key "nycferry-$1";
    proxy_cache_valid 200 10s;
    proxy_cache_valid any 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_set_header Host nycferry.connexionz.net;
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_ssl_server_name on;
    proxy_pass https://nycferry.connexionz.net/rtt/public/utility/gtfsrealtime.aspx/$1;
    add_header Cache-Control "public, max-age=10" always;
    add_header X-Cache-Status $upstream_cache_status always;
    expires 10s;
}
